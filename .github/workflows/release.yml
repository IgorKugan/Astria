name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:shared
      - run: npm run package:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:portable
        env:
          ASTRIA_TEST_AUTO_SAVE: '1'
      - run: npm run release:prepare
        env:
          ASTRIA_UPDATE_PRIVATE_KEY: ${{ secrets.ASTRIA_UPDATE_PRIVATE_KEY }}
      - name: Create draft release for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" --target "$env:GITHUB_SHA" --draft --title "Astria $version" --generate-notes "dist/release/Astria-Portable-$version.zip" dist/release/astria-update.json dist/release/astria-update.sig dist/release/SHA256SUMS.txt
